<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MotoExpress Rosario V4</title>
<style>*{box-sizing:border-box}body{font-family:system-ui,Arial;background:#f1f5f9;color:#17304b;margin:0}header{background:#102b4b;color:white;text-align:center;padding:25px 12px}main{max-width:680px;margin:auto;padding:14px}.panel{background:white;border-radius:14px;padding:18px;margin:15px 0;box-shadow:0 2px 10px #0001}input,select,button{font:inherit;width:100%;padding:12px;margin:6px 0 12px;border-radius:9px}input,select{border:1px solid #cbd5e1}button{border:0;background:#ffc439;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.secondary{background:#dbe4ef}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.item{border-top:1px solid #ddd;padding:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}.notice{white-space:pre-wrap;overflow-wrap:anywhere;color:#334155}[hidden]{display:none!important}nav{display:flex;gap:7px}nav button{font-size:13px}small{color:#64748b}</style></head>
<body><header><div style="font-size:42px">🏍️</div><h1>MotoExpress Rosario</h1><p>Delivery en Villa del Rosario, Zulia</p></header><main>
<section class="panel"><h2>Mi cuenta</h2><div id="signedOut"><input id="email" type="email" placeholder="Correo"><input id="password" type="password" placeholder="Contraseña (mínimo 6 caracteres)"><button id="login">Iniciar sesión</button><button id="newClient" class="secondary">Crear cuenta de cliente</button><button id="newDriver" class="secondary">Crear cuenta de motorizado</button></div><div id="signedIn" hidden><p id="identity"></p><button id="logout" class="secondary">Cerrar sesión</button></div><p class="notice" id="authMsg" role="status"></p></section>
<nav><button data-tab="client">👤 Cliente</button><button data-tab="driver">🏍️ Motorizado</button><button data-tab="admin">🛡️ Admin</button></nav>
<section id="client" class="panel"><h2>Solicitar delivery</h2><select id="service"><option>Envío de paquete</option><option>Compras</option><option>Comida</option><option>Mandados</option></select><input id="origin" maxlength="250" placeholder="Dirección de recogida"><input id="destination" maxlength="250" placeholder="Dirección de entrega"><button id="sendOrder">Solicitar motorizado</button><p class="notice" id="orderMsg"></p><h3>Mis pedidos</h3><button id="loadOrders" class="secondary">Actualizar pedidos</button><div id="orders"></div></section>
<section id="driver" class="panel" hidden><h2>Registro de motorizados</h2><p>Tu solicitud necesita aprobación manual del administrador.</p><div id="driverForm"><input id="driverName" maxlength="100" placeholder="Nombre completo"><input id="driverPhone" maxlength="40" placeholder="Teléfono"><input id="driverVehicle" maxlength="80" placeholder="Vehículo / moto"><input id="driverPlate" maxlength="30" placeholder="Placa"><button id="apply">Enviar solicitud</button></div><p id="driverMsg" class="notice"></p><button id="checkDriver" class="secondary">Consultar mi estado</button><h3>Pedidos asignados</h3><button id="loadDriverOrders" class="secondary">Actualizar pedidos asignados</button><div id="driverOrders"></div></section>
<section id="admin" class="panel" hidden><h2>Administración</h2><p id="adminInfo"></p><div id="adminActions" hidden><button id="loadDrivers">Ver solicitudes de motorizados</button><div id="applications"></div><h3>Pedidos</h3><button id="loadAllOrders">Ver todos los pedidos</button><div id="allOrders"></div></div></section>
</main><script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import {getFirestore,doc,setDoc,getDoc,collection,addDoc,getDocs,query,where,updateDoc,serverTimestamp} from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyA70-DUxBISAK2ILmb1yrtV3ErNc_UzvN8',authDomain:'motoexpress-rosario.firebaseapp.com',projectId:'motoexpress-rosario',storageBucket:'motoexpress-rosario.firebasestorage.app',messagingSenderId:'513603979922',appId:'1:513603979922:web:df43b8cb4734a4e22ff44b',measurementId:'G-5XTNS7F09C'};
const ADMIN_UID='TL0w9U1RfATddACPEcohW7WZrBG3';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),$=id=>document.getElementById(id);
const message=e=>({'permission-denied':'Permiso denegado: revisa reglas y perfil.','auth/email-already-in-use':'Ese correo ya está registrado.','auth/invalid-credential':'Correo o contraseña incorrectos.','auth/weak-password':'Contraseña demasiado corta.'}[e.code]||e.message||String(e));
let role=null;
function tab(id){['client','driver','admin'].forEach(t=>$(t).hidden=t!==id);}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>tab(b.dataset.tab));
async function loadRole(user){role=null;if(!user)return;try{const s=await getDoc(doc(db,'users',user.uid));role=s.exists()?s.data().role:null;}catch(e){$('authMsg').textContent=message(e);}}
onAuthStateChanged(auth,async user=>{$('signedOut').hidden=!!user;$('signedIn').hidden=!user;$('identity').textContent=user?'Conectado: '+user.email:'';$('adminActions').hidden=!(user&&user.uid===ADMIN_UID);$('adminInfo').textContent=user&&user.uid===ADMIN_UID?'Cuenta administradora autorizada.':'Acceso exclusivo del administrador.';await loadRole(user);$('driverMsg').textContent=role==='driver'?'Pulsa Consultar mi estado.':'Para registrarte como motorizado, crea una cuenta de motorizado.';});
async function register(asRole){$('authMsg').textContent='Creando cuenta...';try{const c=await createUserWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);await setDoc(doc(db,'users',c.user.uid),{email:c.user.email,role:asRole,createdAt:serverTimestamp()});role=asRole;$('authMsg').textContent='Cuenta creada. '+(asRole==='driver'?'Abre Motorizado y envía tu solicitud.':'Ya puedes solicitar delivery.');tab(asRole==='driver'?'driver':'client');}catch(e){$('authMsg').textContent=message(e)+' Si la cuenta se creó pero el perfil falló, contacta al administrador.';}}
$('newClient').onclick=()=>register('client');$('newDriver').onclick=()=>register('driver');
$('login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,$('email').value.trim(),$('password').value);$('authMsg').textContent='Sesión iniciada.';}catch(e){$('authMsg').textContent=message(e);}};
$('logout').onclick=async()=>{try{await signOut(auth);role=null;$('authMsg').textContent='Sesión cerrada.';}catch(e){$('authMsg').textContent=message(e);}};
$('sendOrder').onclick=async()=>{const u=auth.currentUser;if(!u||role!=='client'){$('orderMsg').textContent='Inicia sesión con una cuenta de cliente.';return;}const origin=$('origin').value.trim(),destination=$('destination').value.trim();if(!origin||!destination){$('orderMsg').textContent='Completa ambas direcciones.';return;}$('sendOrder').disabled=true;try{const r=await addDoc(collection(db,'orders'),{clientId:u.uid,service:$('service').value,origin,destination,status:'pending',createdAt:serverTimestamp()});$('orderMsg').textContent='Pedido creado: '+r.id+' (pendiente de asignación).';$('origin').value='';$('destination').value='';}catch(e){$('orderMsg').textContent=message(e);}finally{$('sendOrder').disabled=false;}};
function showOrders(target,snap){$(target).replaceChildren();if(snap.empty){$(target).textContent='Sin pedidos.';return;}snap.forEach(s=>{const o=s.data(),el=document.createElement('div');el.className='item';el.textContent=`${o.service||'Servicio'} · ${o.status||''}\n${o.origin||''} → ${o.destination||''}\nCódigo: ${s.id}`;$(target).appendChild(el);});}
$('loadOrders').onclick=async()=>{const u=auth.currentUser;if(!u){$('orders').textContent='Inicia sesión.';return;}try{showOrders('orders',await getDocs(query(collection(db,'orders'),where('clientId','==',u.uid))));}catch(e){$('orders').textContent=message(e);}};
$('apply').onclick=async()=>{const u=auth.currentUser;if(!u||role!=='driver'){$('driverMsg').textContent='Primero crea o inicia sesión con una cuenta de motorizado.';return;}const name=$('driverName').value.trim(),phone=$('driverPhone').value.trim(),vehicle=$('driverVehicle').value.trim(),plate=$('driverPlate').value.trim();if(!name||!phone||!vehicle||!plate){$('driverMsg').textContent='Completa todos los campos.';return;}$('apply').disabled=true;try{await setDoc(doc(db,'drivers',u.uid),{name,phone,vehicle,plate,status:'pending',createdAt:serverTimestamp()});$('driverMsg').textContent='Solicitud enviada. Espera aprobación.';}catch(e){$('driverMsg').textContent=message(e);}finally{$('apply').disabled=false;}};
$('checkDriver').onclick=async()=>{const u=auth.currentUser;if(!u){$('driverMsg').textContent='Inicia sesión.';return;}try{const s=await getDoc(doc(db,'drivers',u.uid));$('driverMsg').textContent=s.exists()?'Estado: '+s.data().status:'Aún no has enviado una solicitud.';}catch(e){$('driverMsg').textContent=message(e);}};
$('loadDriverOrders').onclick=async()=>{const u=auth.currentUser;if(!u){$('driverOrders').textContent='Inicia sesión.';return;}try{showOrders('driverOrders',await getDocs(query(collection(db,'orders'),where('driverId','==',u.uid))));}catch(e){$('driverOrders').textContent=message(e);}};
function adminOnly(){return auth.currentUser?.uid===ADMIN_UID;}
$('loadDrivers').onclick=async()=>{if(!adminOnly())return;const box=$('applications');box.textContent='Cargando...';try{const snap=await getDocs(collection(db,'drivers'));box.replaceChildren();if(snap.empty){box.textContent='No hay solicitudes.';return;}for(const s of snap.docs){const d=s.data(),div=document.createElement('div'),info=document.createElement('p');div.className='item';info.textContent=`${d.name||''} · ${d.phone||''}\n${d.vehicle||''} · ${d.plate||''}\nEstado: ${d.status||''}`;div.appendChild(info);for(const [status,label] of [['approved','Aprobar'],['rejected','Rechazar']]){const btn=document.createElement('button');btn.textContent=label;btn.className=status==='rejected'?'secondary':'';btn.onclick=async()=>{if(!confirm(`${label} a ${d.name||'este motorizado'}?`))return;btn.disabled=true;try{await updateDoc(doc(db,'drivers',s.id),{status});$('loadDrivers').click();}catch(e){alert(message(e));btn.disabled=false;}};div.appendChild(btn);}box.appendChild(div);}}catch(e){box.textContent=message(e);}};
$('loadAllOrders').onclick=async()=>{if(!adminOnly())return;try{showOrders('allOrders',await getDocs(collection(db,'orders')));}catch(e){$('allOrders').textContent=message(e);}};
</script></body></html>
